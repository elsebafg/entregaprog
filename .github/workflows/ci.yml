name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: sebafloresg/container-demo

jobs:
  build:
    name: Build y smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Smoke test de los endpoints
        run: |
          PORT=3000 node dist/index.js &
          server_pid=$!
          for i in $(seq 1 10); do
            curl --silent --fail http://localhost:3000/health && break
            sleep 1
          done
          echo
          curl --silent --fail http://localhost:3000/health | grep '"healthy"'
          curl --silent --fail http://localhost:3000/info | grep '"containerized":true'
          kill "$server_pid"

  codacy:
    name: Codacy (inspeccion de codigo estatico)
    runs-on: ubuntu-latest
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # Con el token (opcional) analiza y sube los resultados al dashboard de Codacy.
      - name: Codacy Analysis CLI (con upload)
        if: ${{ env.CODACY_PROJECT_TOKEN != '' }}
        uses: codacy/codacy-analysis-cli-action@v4.4.7
        with:
          project-token: ${{ env.CODACY_PROJECT_TOKEN }}
          upload: true
          # No cortamos el pipeline por cantidad de issues; el criterio lo define Codacy.
          max-allowed-issues: 2147483647

      # Sin token igual se hace la inspeccion dentro del CI (el dashboard de Codacy
      # lo mantiene al dia su integracion con GitHub).
      - name: Codacy Analysis CLI
        if: ${{ env.CODACY_PROJECT_TOKEN == '' }}
        uses: codacy/codacy-analysis-cli-action@v4.4.7
        with:
          max-allowed-issues: 2147483647

  deploy:
    name: Publicar imagen en Docker Hub
    needs: [build, codacy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # para crear el tag de git con la version
    concurrency:
      group: deploy-image
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # necesitamos todos los tags para calcular la version

      # Bonus: version automatica. Toma el ultimo tag vX.Y y suma 1 a Y.
      # Si todavia no hay ninguno, arranca en 2.0 (la version de la consigna).
      - name: Calcular proxima version
        id: version
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$latest" ]; then
            next="2.0"
          else
            current="${latest#v}"
            next="${current%%.*}.$(( ${current##*.} + 1 ))"
          fi
          echo "Ultimo tag: ${latest:-ninguno} -> nueva version: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: sebafloresg
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push de la imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Registrar la version como tag de git
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
